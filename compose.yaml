name: commerce-platform

x-app: &app
  build: .
  image: commerce-platform:local
  stop_grace_period: 10s

x-database-url: &database-url postgres://commerce:commerce@postgres:5432/commerce
x-otlp-endpoint: &otlp-endpoint http://otel-collector:4318

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce
      POSTGRES_DB: commerce
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP check: the image's temporary init server listens on the socket only.
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'commerce', '-d', 'commerce']
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *app
    command: ['node', 'packages/db/dist/cli/migrate.js']
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  seed:
    <<: *app
    command: ['node', 'packages/db/dist/cli/seed.js']
    environment:
      DATABASE_URL: *database-url
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'

  orders-api:
    <<: *app
    command:
      ['node', '--import', './apps/orders-api/dist/telemetry.js', 'apps/orders-api/dist/main.js']
    environment:
      DATABASE_URL: *database-url
      OTEL_EXPORTER_OTLP_ENDPOINT: *otlp-endpoint
      OTEL_SERVICE_NAME: orders-api
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '3000:3000'
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/readyz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  worker:
    <<: *app
    command: ['node', '--import', './apps/worker/dist/telemetry.js', 'apps/worker/dist/main.js']
    environment:
      DATABASE_URL: *database-url
      OTEL_EXPORTER_OTLP_ENDPOINT: *otlp-endpoint
      OTEL_SERVICE_NAME: worker
      WORKER_ID: worker-1
      HEALTH_PORT: 3001
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '3001:3001'
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/readyz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Telemetry backends (M3). The apps deliberately do not depend_on them: telemetry is optional,
  # and an app must start and stay healthy without it.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ./infra/otel/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - '4318:4318'
      - '13133:13133'
    # Built FROM scratch: no shell, so no Compose healthcheck. Check from the host on :13133.

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    environment:
      # The image sets this too; set explicitly so binding never depends on an image default.
      JAEGER_LISTEN_HOST: 0.0.0.0
    ports:
      - '16686:16686'
      - '13134:13133'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:13133/status']
      interval: 2s
      timeout: 2s
      retries: 30

  prometheus:
    image: prom/prometheus:v3.15.0
    command: ['--config.file=/etc/prometheus/prometheus.yml']
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9090/-/ready']
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  postgres-data:
